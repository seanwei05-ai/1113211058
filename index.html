<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>貪食蛇</title>
<style>
  :root { --bg:#14181f; --panel:#1d232d; --grid:#232b37; --snake:#4ade80; --head:#22c55e; --food:#f87171; --text:#e5e7eb; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;
    touch-action:none; user-select:none;
  }
  h1 { margin:0 0 8px; font-size:1.6rem; letter-spacing:2px; }
  .scores { display:flex; gap:24px; margin-bottom:10px; font-size:1.05rem; }
  .scores b { color:var(--snake); }
  .wrap { position:relative; }
  canvas { background:var(--panel); border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,.45); max-width:92vw; height:auto; }
  .overlay {
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(20,24,31,.78); border-radius:12px; text-align:center; gap:10px; padding:16px;
  }
  .overlay.hidden { display:none; }
  .overlay h2 { margin:0; font-size:1.5rem; }
  .overlay p { margin:0; opacity:.8; font-size:.95rem; }
  button {
    background:var(--snake); color:#06220f; border:0; padding:10px 28px; border-radius:999px;
    font-size:1rem; font-weight:700; cursor:pointer;
  }
  button:active { transform:scale(.96); }
  .pad { display:grid; grid-template-columns:repeat(3,60px); grid-template-rows:repeat(2,60px); gap:8px; margin-top:14px; }
  .pad button { background:var(--panel); color:var(--text); border-radius:14px; font-size:1.4rem; padding:0; }
  .pad .up { grid-column:2; grid-row:1; }
  .pad .left { grid-column:1; grid-row:2; }
  .pad .down { grid-column:2; grid-row:2; }
  .pad .right { grid-column:3; grid-row:2; }
  .hint { margin-top:10px; font-size:.85rem; opacity:.6; }
  @media (min-width: 700px) and (pointer: fine) { .pad { display:none; } }
</style>
</head>
<body>
  <h1>🐍 貪食蛇</h1>
  <div class="scores">
    <div>分數：<b id="score">0</b></div>
    <div>最高分：<b id="best">0</b></div>
  </div>
  <div class="wrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">貪食蛇</h2>
      <p id="ovText">方向鍵 / WASD 控制，空白鍵暫停</p>
      <button id="startBtn">開始遊戲</button>
    </div>
  </div>
  <div class="pad">
    <button class="up" data-dir="up">▲</button>
    <button class="left" data-dir="left">◀</button>
    <button class="down" data-dir="down">▼</button>
    <button class="right" data-dir="right">▶</button>
  </div>
  <div class="hint">手機也可以在畫面上滑動來轉向</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText = document.getElementById('ovText');
  const startBtn = document.getElementById('startBtn');

  const CELL = 20;
  const COLS = canvas.width / CELL;
  const ROWS = canvas.height / CELL;
  const css = getComputedStyle(document.documentElement);
  const C = k => css.getPropertyValue(k).trim();

  let snake, dir, nextDir, food, score, timer, speed, running, paused;
  let best = 0;
  try { best = parseInt(localStorage.getItem('snake-best') || '0', 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  const DIRS = {
    up: {x:0,y:-1}, down: {x:0,y:1}, left: {x:-1,y:0}, right: {x:1,y:0}
  };

  function reset() {
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir = DIRS.right; nextDir = dir;
    score = 0; speed = 130; paused = false;
    scoreEl.textContent = 0;
    placeFood();
  }

  function placeFood() {
    while (true) {
      const f = { x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS) };
      if (!snake.some(s => s.x === f.x && s.y === f.y)) { food = f; return; }
    }
  }

  function start() {
    reset();
    running = true;
    overlay.classList.add('hidden');
    schedule();
    draw();
  }

  function schedule() {
    clearInterval(timer);
    timer = setInterval(tick, speed);
  }

  function tick() {
    if (paused) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // 撞牆或撞到自己
    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      if (score % 5 === 0 && speed > 60) { speed -= 8; schedule(); }
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function gameOver() {
    running = false;
    clearInterval(timer);
    if (score > best) {
      best = score; bestEl.textContent = best;
      try { localStorage.setItem('snake-best', best); } catch (e) {}
    }
    ovTitle.textContent = '遊戲結束';
    ovText.textContent = `你的分數：${score}　最高分：${best}`;
    startBtn.textContent = '再玩一次';
    overlay.classList.remove('hidden');
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // 棋盤格
    ctx.fillStyle = C('--grid');
    for (let x = 0; x < COLS; x++)
      for (let y = 0; y < ROWS; y++)
        if ((x + y) % 2 === 0) ctx.fillRect(x*CELL, y*CELL, CELL, CELL);
    // 食物
    ctx.fillStyle = C('--food');
    ctx.beginPath();
    ctx.arc(food.x*CELL + CELL/2, food.y*CELL + CELL/2, CELL/2 - 2, 0, Math.PI*2);
    ctx.fill();
    // 蛇
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? C('--head') : C('--snake');
      roundRect(s.x*CELL + 1, s.y*CELL + 1, CELL - 2, CELL - 2, 6);
      ctx.fill();
    });
    // 眼睛
    const h = snake[0];
    ctx.fillStyle = '#06220f';
    const ex = dir.x === 0 ? [5, 15] : [dir.x > 0 ? 14 : 6, dir.x > 0 ? 14 : 6];
    const ey = dir.y === 0 ? [5, 15] : [dir.y > 0 ? 14 : 6, dir.y > 0 ? 14 : 6];
    for (let i = 0; i < 2; i++) {
      ctx.beginPath();
      ctx.arc(h.x*CELL + ex[i], h.y*CELL + ey[i], 2, 0, Math.PI*2);
      ctx.fill();
    }
  }

  function turn(name) {
    const d = DIRS[name];
    if (!d || !running) return;
    // 不能直接回頭
    if (d.x === -dir.x && d.y === -dir.y) return;
    nextDir = d;
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (paused) {
      ovTitle.textContent = '已暫停';
      ovText.textContent = '按空白鍵繼續';
      startBtn.textContent = '繼續';
      overlay.classList.remove('hidden');
    } else {
      overlay.classList.add('hidden');
    }
  }

  // 鍵盤
  const KEYS = {
    ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
    w:'up', s:'down', a:'left', d:'right', W:'up', S:'down', A:'left', D:'right'
  };
  window.addEventListener('keydown', e => {
    if (KEYS[e.key]) { e.preventDefault(); turn(KEYS[e.key]); }
    else if (e.key === ' ') {
      e.preventDefault();
      if (!running) start(); else togglePause();
    }
  });

  // 按鈕
  startBtn.addEventListener('click', () => { if (running && paused) togglePause(); else start(); });
  document.querySelectorAll('.pad button').forEach(b =>
    b.addEventListener('pointerdown', e => { e.preventDefault(); turn(b.dataset.dir); })
  );

  // 滑動
  let t0 = null;
  window.addEventListener('touchstart', e => { const t = e.touches[0]; t0 = {x:t.clientX, y:t.clientY}; }, {passive:true});
  window.addEventListener('touchend', e => {
    if (!t0) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - t0.x, dy = t.clientY - t0.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 24) {
      if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 'right' : 'left');
      else turn(dy > 0 ? 'down' : 'up');
    }
    t0 = null;
  });

  reset();
  draw();
})();
</script>
</body>
</html>
